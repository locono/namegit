<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NameGit</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a2233;--sub:#6b7280;--line:#e5e8ee;--accent:#2563eb;--accent-soft:#eff4ff;--chip:#f3f5f8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
header{text-align:center;margin-bottom:28px}
h1{font-size:1.7rem;letter-spacing:.5px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 20px;text-align:center;min-width:110px}
.stat b{display:block;font-size:1.35rem}
.stat span{font-size:.8rem;color:var(--sub)}
.stat:nth-child(1){background:#eff4ff;border-color:#c7d7fe}.stat:nth-child(1) b{color:#2563eb}
.stat:nth-child(2){background:#ecfdf3;border-color:#b7e7c9}.stat:nth-child(2) b{color:#16a34a}
.stat:nth-child(3){background:#f5f0ff;border-color:#ddc9fc}.stat:nth-child(3) b{color:#9333ea}
.stat:nth-child(4){background:#fff4ec;border-color:#fcd4b6}.stat:nth-child(4) b{color:#ea580c}
.search{max-width:420px;margin:24px auto 0;position:relative}
.search input{width:100%;padding:11px 16px 11px 40px;border:1px solid var(--line);border-radius:999px;font-size:.95rem;background:var(--card);outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--sub)}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 8px}
nav a{font-size:.82rem;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-decoration:none;transition:.15s}
nav a:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
section{margin-top:34px}
.group-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--gc,var(--line));padding-bottom:8px;margin-bottom:14px}
.group-head h2{font-size:1.05rem;color:var(--gc,var(--accent))}
.group-head .cnt{font-size:.78rem;color:var(--gc,var(--accent));background:var(--chip);border-radius:999px;padding:2px 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--gc,var(--accent));background:var(--accent-soft);color:var(--gc,var(--accent))}
.chip.copied{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
.empty{display:none;text-align:center;color:var(--sub);padding:48px 0}
footer{text-align:center;margin-top:56px}
.foot-note{color:var(--sub);font-size:1.1rem;font-weight:700;margin-top:16px}
footer .mail{color:#e8590c;cursor:pointer;border-bottom:2px dotted #e8590c}
#top-btn{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:1.6rem;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);display:none}
#top-btn:hover{background:var(--accent-soft)}
</style>
</head>

const main=document.getElementById('main'),nav=document.getElementById('nav');
const PALETTE=['#2563eb','#16a34a','#ea580c','#9333ea','#0891b2','#e11d48','#ca8a04'];let gi=0;
function group(title,items,anchor){
  if(!items.length)return null;
  const s=document.createElement('section');s.id=anchor;
  s.style.setProperty('--gc',PALETTE[gi++%PALETTE.length]);
  s.innerHTML='<div class="group-head"><h2>'+title+'</h2><span class="cnt">'+items.length+'</span></div>';
  const box=document.createElement('div');box.className='chips';
  for(const d of items){const c=document.createElement('span');c.className='chip';c.textContent=d;box.appendChild(c);}
  s.appendChild(box);return s;
}
const frag=document.createDocumentFragment();
frag.appendChild(group('纯数字',DATA.nums,'g-num'));
for(const[len,items]of Object.entries(DATA.alphas)){
  const g=group(len+' 字母',items,'g-a'+len);if(g)frag.appendChild(g);
}
for(const[len,items]of Object.entries(DATA.mixeds)){
  const g=group(len+' 位混合（字母+数字）',items,'g-m'+len);if(g)frag.appendChild(g);
}
main.appendChild(frag);
// 导航
const links=[];
for(const s of main.querySelectorAll('section')){
  const a=document.createElement('a');a.href='#'+s.id;
  a.textContent=s.querySelector('h2').textContent.replace(/（.*）/,'');
  nav.appendChild(a);
}
// 复制
main.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  navigator.clipboard.writeText(c.textContent).then(()=>{
    c.classList.add('copied');const t=c.textContent;c.textContent='已复制 ✓';
    setTimeout(()=>{c.textContent=t;c.classList.remove('copied');},900);
  });
});
// 搜索过滤
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();let n=0;
  for(const chip of main.querySelectorAll('.chip')){
    const hit=!v||chip.textContent.includes(v);
    chip.style.display=hit?'':'none';if(hit)n++;
  }
  for(const s of main.querySelectorAll('section')){
    const visible=[...s.querySelectorAll('.chip')].some(c=>c.style.display!=='none');
    s.style.display=visible?'':'none';
  }
  document.getElementById('empty').style.display=n?'none':'block';
});
// 邮箱点击复制
const mail=document.querySelector('footer .mail');
mail.addEventListener('click',()=>{
  navigator.clipboard.writeText('cesa@163.com').then(()=>{
    const o=mail.textContent;
    mail.textContent='已复制 ✓';
    setTimeout(()=>{mail.textContent=o;},1000);
  });
});
// 回到顶部
const tb=document.getElementById('top-btn');
addEventListener('scroll',()=>{tb.style.display=scrollY>400?'block':'none';});
tb.onclick=()=>scrollTo({top:0,behavior:'smooth'});
